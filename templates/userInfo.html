{% extends 'base.html' %}
{% block content %}
<br><br>
<div class="container container-center">
    <div class="card border-none " style="max-width: 50rem;">
        <div class="card-body text-primary">
            <h5 class="card-title">User Informations</h5>
            <p class="card-text">Username : {{userInfo.Name}}</p>
            <p class="card-text">Age : {{userInfo.Age}}</p>
            <p class="card-text">Gender Number : {{userInfo.Gender}}</p>
            <p class="card-text">Height Email : {{userInfo.Height}}</p>
            
            <br><br>
            <a href="{% url 'userInfo' %}" class="btn btn-primary">Update</a>
            <br>
        </div>
    </div>
</div>
{% endblock %}
